<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Flow Monitor</title>
  <style>
    :root {
      --ink: #16202c; --muted: #5d6b7a; --line: #e1e6ec; --bg: #f5f7fa; --card: #fff;
      --hot: #c2410c; --hot-bg: #fff1e8; --warm: #a16207; --warm-bg: #fdf6dc; --cold: #47627e; --cold-bg: #ebf1f7;
      --slack: #3f0e40; --link: #1264a3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    header { padding: 16px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--card); }
    header h1 { font-size: 17px; margin: 0; }
    header .sub { color: var(--muted); }
    header .spacer { flex: 1; }
    header a, header button { font: inherit; color: var(--link); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none; }
    .stats { display: flex; gap: 12px; padding: 16px 24px 0; flex-wrap: wrap; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 120px; }
    .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 12px; }
    main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 16px; padding: 16px 24px 24px; }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; padding: 16px; } .stats, header { padding-left: 16px; padding-right: 16px; } }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    td.num { font-variant-numeric: tabular-nums; text-align: right; }
    .who b { display: block; }
    .who span, .co span { color: var(--muted); font-size: 12px; display: block; }
    .tier { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .tier.hot { color: var(--hot); background: var(--hot-bg); }
    .tier.warm { color: var(--warm); background: var(--warm-bg); }
    .tier.cold { color: var(--cold); background: var(--cold-bg); }
    .reasons { color: var(--muted); font-size: 12px; max-width: 280px; }
    .empty { color: var(--muted); padding: 24px 14px; }
    .slack { background: #fff; }
    .channel { padding: 8px 14px; font-weight: 700; color: var(--slack); background: #f8f5f8; border-bottom: 1px solid var(--line); }
    .msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .avatar { width: 36px; height: 36px; border-radius: 6px; background: #ea4b71; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
    .avatar.ops { background: #e07b00; }
    .meta b { margin-right: 6px; }
    .meta span { color: var(--muted); font-size: 12px; }
    .blk-header { font-weight: 700; font-size: 15px; margin: 4px 0; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 6px 0; }
    .fields div { white-space: pre-line; }
    .quote { border-left: 4px solid #ddd; padding-left: 8px; color: #333; margin: 6px 0; }
    .ctx { color: var(--muted); font-size: 12px; margin-top: 4px; }
    pre { white-space: pre-wrap; background: #f6f6f6; border: 1px solid #e5e5e5; border-radius: 4px; padding: 6px; font-size: 12px; margin: 6px 0 0; }
  </style>
</head>
<body>
<header>
  <h1>Lead Flow Monitor</h1>
  <span class="sub">What reached the mock CRM and Slack</span>
  <span class="spacer"></span>
  <a href="/form" target="_blank">Open lead form</a>
  <button id="reset" type="button">Reset</button>
</header>
<div class="stats" id="stats"></div>
<main>
  <section>
    <h2>CRM contacts</h2>
    <div class="table-wrap" id="contacts"></div>
  </section>
  <section class="slack">
    <h2>Slack</h2>
    <div id="messages"></div>
  </section>
</main>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // Slack mrkdwn to HTML, enough for the messages the workflows send.
  const mrkdwn = (text) => esc(String(text ?? '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&'))
    .replace(/&lt;mailto:[^|]+\|([^&]+)&gt;/g, '$1')
    .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
    .replace(/:fire:/g, '🔥').replace(/:warning:/g, '⚠️')
    .replace(/\n/g, '<br>');
  const time = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  function renderBlocks(m) {
    if (!m.blocks?.length) return `<div>${mrkdwn(m.text)}</div>`;
    return m.blocks.map((b) => {
      if (b.type === 'header') return `<div class="blk-header">${mrkdwn(b.text?.text)}</div>`;
      if (b.type === 'context') return `<div class="ctx">${b.elements.map((e) => mrkdwn(e.text)).join(' ')}</div>`;
      if (b.type === 'section' && b.fields) return `<div class="fields">${b.fields.map((f) => `<div>${mrkdwn(f.text)}</div>`).join('')}</div>`;
      if (b.type === 'section' && b.text) {
        const t = b.text.text ?? '';
        if (t.startsWith('```')) return `<pre>${esc(t.replace(/```/g, ''))}</pre>`;
        if (t.startsWith('>')) return `<div class="quote">${mrkdwn(t.slice(1))}</div>`;
        return `<div>${mrkdwn(t)}</div>`;
      }
      return '';
    }).join('');
  }

  async function refresh() {
    const state = await (await fetch('/api/state')).json();
    const tiers = { hot: 0, warm: 0, cold: 0 };
    state.contacts.forEach((c) => { tiers[c.leadTier] = (tiers[c.leadTier] ?? 0) + 1; });
    document.getElementById('stats').innerHTML = [
      [state.contacts.length, 'CRM contacts'],
      [tiers.hot, 'hot'], [tiers.warm, 'warm'], [tiers.cold, 'cold'],
      [state.messages.length, 'Slack messages'],
      [state.requests.enrich, 'enrichment calls'],
    ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

    document.getElementById('contacts').innerHTML = state.contacts.length ? `
      <table>
        <thead><tr><th>Contact</th><th>Company</th><th>Tier</th><th class="num">Score</th><th>Why</th><th>Source</th><th class="num">Subm.</th><th>Updated</th></tr></thead>
        <tbody>${state.contacts.map((c) => `
          <tr>
            <td class="who"><b>${esc([c.firstName, c.lastName].filter(Boolean).join(' '))}</b><span>${esc(c.email)}</span></td>
            <td class="co">${esc(c.company || '—')}<span>${esc([c.industry, c.employees && `${c.employees} staff`, c.country].filter(Boolean).join(' · '))}</span></td>
            <td><span class="tier ${esc(c.leadTier)}">${esc(c.leadTier)}</span></td>
            <td class="num">${esc(c.leadScore)}</td>
            <td class="reasons">${esc(c.scoreReasons || '')}</td>
            <td>${esc(c.source)}${c.latestSource && c.latestSource !== c.source ? ` → ${esc(c.latestSource)}` : ''}</td>
            <td class="num">${esc(c.submissions)}</td>
            <td>${time(c.updatedAt)}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty">No contacts yet. Submit the lead form or run <code>npm run send-leads</code>.</div>';

    const byChannel = {};
    state.messages.forEach((m) => (byChannel[m.channel] ??= []).push(m));
    const channels = Object.keys(byChannel).sort();
    document.getElementById('messages').innerHTML = channels.length ? channels.map((ch) => `
      <div class="channel">${esc(ch)}</div>
      ${byChannel[ch].map((m) => `
        <div class="msg">
          <div class="avatar ${ch.includes('ops') ? 'ops' : ''}">${ch.includes('ops') ? '!' : 'LB'}</div>
          <div><div class="meta"><b>Lead Bot</b><span>${time(m.receivedAt)}</span></div>${renderBlocks(m)}</div>
        </div>`).join('')}`).join('') : '<div class="empty">No messages yet. Hot leads land in #sales-hot.</div>';
  }

  document.getElementById('reset').onclick = async () => { await fetch('/_mock/reset', { method: 'POST' }); refresh(); };
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
